<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding:20px">
<h2>Type ICAOs</h2>
Dep: <input id="dep" value="KJFK" style="padding:6px">
Arr: <input id="arr" value="EGLL" style="padding:6px">
<button onclick="make()" style="padding:6px 12px">Make Route</button>
<pre id="out" style="background:#eee; padding:15px; margin-top:20px">Ready</pre>

<script>
async function make(){
  const dep = document.getElementById('dep').value.toUpperCase();
  const arr = document.getElementById('arr').value.toUpperCase();
  document.getElementById('out').innerText = `Calculating ${dep} -> ${arr} with wind + OpenAP fuel...\nWorking!`;
}
</script>
</body>
</html>
